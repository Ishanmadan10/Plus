name: Code Agent — Implement Approved Suggestion

on:
  issues:
    types: [labeled]
  workflow_dispatch:
  
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'approved'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install google-genai PyGithub

      - name: Build check before changes
        run: |
          xcodebuild build \
            -project positive.xcodeproj \
            -scheme positive \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
          | grep -E 'error:|warning:|BUILD' || true

      - name: Run Code Agent
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 60
          command: python agents/code_agent.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}

      # - name: Build check after changes
      #   run: |
      #     xcodebuild build \
      #       -project positive.xcodeproj \
      #       -scheme positive \
      #       -destination 'platform=iOS Simulator,name=iPhone 15' \
      #       CODE_SIGNING_ALLOWED=NO \
      #     | grep -E 'error:|BUILD'
